<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achei! | Registrar objeto</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="topo">
        <div class="wrap topo__linha">
            <a class="marca" href="index.html">🔎 Achei!</a>

            <nav>
                <ul class="menu">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="objetos.html">Objetos</a></li>
                    <li><a href="cadastrar.html">Cadastrar</a></li>
                    <li><a href="como-funciona.html">Como funciona</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="bloco bloco--cinza">
            <div class="wrap estreito">

                <h2>Registrar um objeto</h2>

                <p class="intro">
                    Perdeu ou encontrou alguma coisa?
                    Preencha o formulário para registrar o objeto.
                </p>

                <form class="formulario" action="confirmacao.html" method="get">

                    <fieldset class="grupo">
                        <legend>Tipo de registro</legend>

                        <div class="opcoes">
                            <label class="opcao">
                                <input type="radio" name="tipo"
                                    value="Perdido" required>
                                Objeto perdido
                            </label>

                            <label class="opcao">
                                <input type="radio" name="tipo"
                                    value="Encontrado">
                                Objeto encontrado
                            </label>
                        </div>
                    </fieldset>

                    <div class="campo">
                        <label for="nomeObjeto">Nome do objeto</label>
                        <input type="text" id="nomeObjeto"
                            name="objeto"
                            placeholder="Ex.: Mochila preta"
                            required>
                    </div>

                    <div class="dupla">
                        <div class="campo">
                            <label for="categoria">Categoria</label>

                            <select id="categoria" name="categoria" required>
                                <option value="">Selecione</option>
                                <option value="Eletrônicos">Eletrônicos</option>
                                <option value="Documentos">Documentos</option>
                                <option value="Vestuário">Vestuário</option>
                                <option value="Material escolar">Material escolar</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="data">Data</label>
                            <input type="date" id="data"
                                name="data" required>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="local">Local</label>
                        <input type="text" id="local" name="local"
                            placeholder="Ex.: Biblioteca, bloco A"
                            required>
                    </div>

                    <div class="campo">
                        <label for="descricao">Descrição do objeto</label>
                        <textarea id="descricao" name="descricao"
                            rows="5"
                            placeholder="Descreva as características do objeto..."
                            required></textarea>
                    </div>

                    <div class="campo">
                        <label for="nome">Seu nome</label>
                        <input type="text" id="nome" name="nome"
                            placeholder="Digite seu nome"
                            required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail para contato</label>
                        <input type="email" id="email" name="email"
                            placeholder="seuemail@exemplo.com"
                            required>
                    </div>

                    <label class="consentimento">
                        <input type="checkbox" required>
                        Confirmo que as informações fornecidas são verdadeiras.
                    </label>

                    <button type="submit" class="btn btn--cheio">
                        Registrar objeto
                    </button>

                </form>

            </div>
        </section>
    </main>

    <footer class="rodape">
        <div class="wrap">
            <p><strong>🔎 Achei!</strong> • Facilitando o reencontro com o que é seu.</p>
            <p class="pequeno">Projeto acadêmico demonstrativo em HTML e CSS.</p>
        </div>
    </footer>

</body>
</html>
